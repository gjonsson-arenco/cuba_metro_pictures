<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-label="Campeonato Metropolitano - CUBA 2026">
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- Left building -->
    <path d="M20 200 L20 130 L35 115 L50 130 L50 200 Z" />
    <line x1="30" y1="145" x2="42" y2="145" />
    <line x1="30" y1="160" x2="42" y2="160" />
    <line x1="30" y1="175" x2="42" y2="175" />
    <line x1="30" y1="190" x2="42" y2="190" />
    <line x1="35" y1="140" x2="35" y2="200" />

    <!-- Right building -->
    <path d="M250 200 L250 130 L265 115 L280 130 L280 200 Z" />
    <line x1="258" y1="145" x2="272" y2="145" />
    <line x1="258" y1="160" x2="272" y2="160" />
    <line x1="258" y1="175" x2="272" y2="175" />
    <line x1="258" y1="190" x2="272" y2="190" />
    <line x1="265" y1="140" x2="265" y2="200" />

    <!-- Middle buildings (shorter, flanking the sailboat) -->
    <path d="M60 200 L60 150 L75 135 L90 150 L90 200 Z" />
    <line x1="70" y1="165" x2="82" y2="165" />
    <line x1="70" y1="180" x2="82" y2="180" />
    <line x1="75" y1="160" x2="75" y2="200" />

    <path d="M210 200 L210 150 L225 135 L240 150 L240 200 Z" />
    <line x1="218" y1="165" x2="230" y2="165" />
    <line x1="218" y1="180" x2="230" y2="180" />
    <line x1="225" y1="160" x2="225" y2="200" />

    <!-- Sailboat mast -->
    <line x1="150" y1="30" x2="150" y2="180" />

    <!-- Sail (triangle) -->
    <path d="M150 40 L150 165 L110 165 Z" />

    <!-- Hull -->
    <path d="M100 180 Q150 200 200 180 L190 195 Q150 205 110 195 Z" fill="currentColor" stroke="none" />

    <!-- Ground line -->
    <line x1="10" y1="200" x2="290" y2="200" stroke-width="5" />
  </g>

  <g fill="currentColor">
    <text x="150" y="230" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-weight="700" font-size="26" letter-spacing="2">METROPOLITANO</text>
    <text x="150" y="252" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="500" font-size="16" letter-spacing="6">CUBA  2026</text>
  </g>
</svg>
