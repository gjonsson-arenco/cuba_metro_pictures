AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Metro Photos - Serverless Photo Gallery for Campeonato Metropolitano

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref PhotosTable
        S3_RAW_BUCKET: !Sub "metro-photos-raw-${Environment}-${AWS::AccountId}"
        S3_PROCESSED_BUCKET: !Ref ProcessedBucket
        CLOUDFRONT_URL: !Sub "https://${CloudFrontDistribution.DomainName}"
        ALLOWED_ORIGIN: !Sub "https://${CloudFrontDistribution.DomainName}"
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
  # NOTE: no `Api:` block here on purpose. `Globals.Api.Cors` only applies to
  # AWS::Serverless::Api (REST). This stack uses AWS::Serverless::HttpApi, whose
  # CORS lives in the HttpApi resource below.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  AdminEmail:
    Type: String
    Description: Email for the initial admin user
  SharpLayerArn:
    Type: String
    Description: Full ARN (including version) of the Sharp Lambda layer

Resources:
  # ============================================================
  # DynamoDB Table
  # ============================================================
  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "metro-photos-${Environment}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: photoId
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
        - AttributeName: uploadedAt
          AttributeType: S
      KeySchema:
        - AttributeName: photoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byUploadDate-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: uploadedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================
  # S3 Buckets
  # ============================================================
  # NOTE: everything else refers to this bucket by its literal name, never by
  # !Ref RawBucket. ProcessPhotoFunction has an S3 event on it, so SAM puts a
  # NotificationConfiguration on the bucket pointing at the function -- and a
  # !Ref back from the function (or its role) closes a circular dependency.
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "metro-photos-raw-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # GLACIER_IR (not GLACIER): downloadPhoto presigns a GetObject against
          # this bucket, and plain GLACIER would fail with InvalidObjectState.
          - Id: MoveToGlacierIRAfter90Days
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "metro-photos-processed-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "metro-photos-frontend-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ProcessedBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ============================================================
  # CloudFront
  # ============================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "metro-photos-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Metro Photos CDN (${Environment})"
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
          - Id: ProcessedImagesOrigin
            DomainName: !GetAtt ProcessedBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        CacheBehaviors:
          - PathPattern: '/thumbnails/*'
            TargetOriginId: ProcessedImagesOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
          - PathPattern: '/medium/*'
            TargetOriginId: ProcessedImagesOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  # ============================================================
  # Cognito
  # ============================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "metro-photos-users-${Environment}"
      # Invite-only. Without this, Cognito's default lets anyone self-register
      # through the public SignUp API using the client id baked into the SPA
      # bundle -- and since downloadPhoto only requires being logged in, that
      # would hand every original away.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          # MinimumLength must match PASSWORD_MIN_LENGTH in shared/src/types.ts
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          # Generated credentials are one-use; give the person a month to redeem it.
          TemporaryPasswordValidityDays: 30

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "metro-photos-app-${Environment}"
      ExplicitAuthFlows:
        # ALLOW_USER_SRP_AUTH is required: Amplify v6 signIn() uses SRP by default.
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Full access, including user management

  EditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: editor
      UserPoolId: !Ref UserPool
      Description: Full photo management, no user management

  # ============================================================
  # API Gateway with Cognito Authorizer
  # ============================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${CloudFrontDistribution.DomainName}"
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ============================================================
  # Lambda Functions
  #
  # All functions are bundled with esbuild: `npm install` cannot resolve the
  # pnpm `workspace:*` dependency on @metro/shared, so esbuild inlines it.
  # `sharp` stays external and is provided by the layer.
  # ============================================================
  ListPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-list-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/listPhotos/
      Description: List photos with optional tag filtering
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos
            Method: GET

  UploadPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-upload-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/uploadPhotos/
      Description: Generate presigned URLs for direct S3 upload
      Policies:
        - S3WritePolicy:
            BucketName: !Sub "metro-photos-raw-${Environment}-${AWS::AccountId}"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload/presigned
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  TagPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-tag-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/tagPhotos/
      Description: Apply tags to uploaded photos
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref PhotosTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/tag
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  DeletePhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-delete-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/deletePhoto/
      Description: Soft delete a photo
      Policies:
        # Crud, not Write: the handler reads the item with GetCommand first.
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/{photoId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  DownloadPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-download-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/downloadPhoto/
      Description: Presigned GET of the original file (login required unless publicDownloads is on)
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
        - S3ReadPolicy:
            BucketName: !Sub "metro-photos-raw-${Environment}-${AWS::AccountId}"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/{photoId}/download
            Method: GET
            # No Authorizer on purpose. The `publicDownloads` setting decides at
            # runtime whether an anonymous caller is allowed, so the handler
            # verifies the bearer token itself (and rejects an invalid one).

  UpdatePhotoMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-metadata-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/updatePhotoMetadata/
      Description: Edit tags / sailing class / regatta day of a photo
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/{photoId}/metadata
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  RotatePhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-rotate-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/rotatePhoto/
      Description: Rotate the original and regenerate thumb + medium
      MemorySize: 1024
      Timeout: 120
      Layers:
        - !Ref SharpLayerArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
        - S3CrudPolicy:
            BucketName: !Sub "metro-photos-raw-${Environment}-${AWS::AccountId}"
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/{photoId}/rotate
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  ProcessPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-process-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/processPhoto/
      Description: Auto-process photos on S3 upload (resize)
      MemorySize: 1024
      Timeout: 120
      Layers:
        - !Ref SharpLayerArn
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "metro-photos-raw-${Environment}-${AWS::AccountId}"
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket
        - DynamoDBWritePolicy:
            TableName: !Ref PhotosTable
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/

  # ============================================================
  # Site settings
  # ============================================================
  GetSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-settings-get-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/getSettings/
      Description: Read site settings (public - the gallery needs them logged out)
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings
            Method: GET

  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-settings-update-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/updateSettings/
      Description: Change site settings (admin only)
      Policies:
        # Crud, not Write: the handler reads the current settings before writing.
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================
  # User management (ABM) - admin only, backed by Cognito
  # ============================================================
  ListUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-users-list-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/listUsers/
      Description: List pool users with their role
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-users-create-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/createUser/
      Description: Create a user with a generated permanent password
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-users-update-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/updateUser/
      Description: Change a user role or enable/disable them
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{username}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-users-delete-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/deleteUser/
      Description: Delete a user
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{username}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  ResetUserPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "metro-photos-users-reset-pw-${Environment}"
      Handler: index.handler
      CodeUri: ../../packages/backend/.lambda/resetUserPassword/
      Description: Set a new generated password for a user
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{username}/reset-password
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontUrl"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidations)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  FrontendBucketName:
    Description: S3 bucket for frontend
    Value: !Ref FrontendBucket

  PhotosTableName:
    Description: DynamoDB table name
    Value: !Ref PhotosTable
